name: Update Scout public feed

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test validator offline
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate feed
        run: python mirror.py
      - name: Commit only when changed
        run: |
          if git diff --quiet -- scout-current.json; then
            echo 'Scout feed unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scout-current.json
          git commit -m 'Update Scout public feed'
          git push
